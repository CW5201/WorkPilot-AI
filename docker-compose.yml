services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_FALLBACK_RULE_BASED=true
      - REDIS_URL=redis://redis:6379/0
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=workpilot
      - PG_PASSWORD=workpilot
      - PG_DB=workpilot
      - MILVUS_URI=http://milvus:19530
    volumes:
      - ./data:/srv/data
    depends_on:
      - redis
      - postgres
      - milvus

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: workpilot
      POSTGRES_PASSWORD: workpilot
      POSTGRES_DB: workpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  milvus:
    image: milvusdb/milvus:latest
    environment:
      ETCD_USE_EMBED: "true"
      COMMON_STORAGETYPE: "local"
    ports:
      - "19530:19530"
    volumes:
      - milvusdata:/var/lib/milvus

volumes:
  pgdata:
  milvusdata:
